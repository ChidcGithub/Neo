# 自动构建 Windows 发行包并发布 GitHub Release。
# 产物：neo-<ver>-installer-x64.exe（NSIS 安装包）+ neo-<ver>-portable-x64.zip（便携包）。
# 触发：推送 v* 标签，或手动 workflow_dispatch（必须已有对应版本 tag 且指向所选提交）。
# 版本号含 "-"（如 -rc...）时发布为 pre-release。
#
# main / release/** 推送及面向 main 的 PR 仅编译检查与运行无外部副作用的定向测试。
# 打包、模型下载及发布仅在 tag 或手动触发时执行，且必须先通过检查。

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 普通检查只读；写权限仅授予 tag / 手动发布任务。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
  PYTHONUTF8: "1"

# 分支检查被新推送取代即可取消；tag 发布永不取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-msvc

      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc

      # 仅运行纯逻辑/临时数据库测试；不运行真实截图、麦克风或 GUI 工具测试。
      - name: Safe library tests
        run: cargo test --locked -p neo-llm -p neo-store -p neo-theme -p neo-ui --lib -- --skip local_http_eof_and_normal_completion

      - name: Tool policy tests
        run: 'cargo test --locked -p neo-tools --lib policy::tests::'

      - name: UIA validation and search contracts (no live desktop probe)
        run: 'cargo test --locked -p neo-tools --lib --target x86_64-pc-windows-msvc -- screen_uia:: screen_elements:: screen_element_search:: click::tests:: --test-threads=1'

      # 原生命中测试使用从不激活的私有 desktop，无截图/输入注入；GPU 测试仍 opt-in。
      - name: Overlay contracts and native hit testing
        run: 'cargo test --locked -p neo-overlay --lib --target x86_64-pc-windows-msvc'

      - name: App overlay fallback tests (no GUI or audio)
        shell: pwsh
        run: |
          cargo test --locked -p neo-app --bin neo graphics --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo startup:: --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo --target x86_64-pc-windows-msvc -- ui::miniwin:: ui::confirmwin:: ui::classwin:: ui::toastwin::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo task_epoch --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo --target x86_64-pc-windows-msvc -- app::restore_tests:: --test-threads=1 --skip attachment_and_text_sends_reach_local_mock_model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo desktop_barrier --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo safety_overlay_loss_reopens_fallback_and_invalidates_old_answer --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo toast_overlay_loss_keeps_deadline_and_registers_passive_fallback_each_frame --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p neo-app --bin neo backend_switch_resets_positions_but_preserves_local_beam_cache --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update metadata policy tests (no network)
        run: 'cargo test --locked -p neo-app --bin neo updates::tests::'

      - name: Installer and release checks (isolated, never install)
        run: python -m unittest tools.test_installer tools.test_check_release tools.test_fetch_runtime tools.test_release_workflow -v

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史生成 changelog

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $m = @(Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"')
          if ($m.Count -ne 1) { throw "cannot determine workspace Cargo version" }
          $v = $m[0].Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$v") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match Cargo version 'v$v'"
          }
          if (-not $v) { throw "cannot determine version" }
          # 手动运行也只发布已存在且与构建提交一致的版本 tag，绝不隐式从默认分支建 tag。
          $tagCommit = git --no-pager rev-parse --verify "refs/tags/v$v^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Create tag v$v at the intended release commit before dispatching" }
          $buildCommit = git --no-pager rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine checkout commit' }
          if ($tagCommit -cne $buildCommit -or $buildCommit -cne $env:GITHUB_SHA) {
            throw "Tag v$v must point at the checked-out workflow commit $env:GITHUB_SHA"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          $pre = if ($v -match '-') { 'true' } else { 'false' }
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          echo "version=$v prerelease=$pre"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-msvc

      - name: Build
        run: cargo build --locked --release -p neo-app --target x86_64-pc-windows-msvc

      # ---- 以下全部为打包/发布步骤：分支推送及 PR 不执行 ----

      - name: Download STT models
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models'
          New-Item -ItemType Directory -Force assets-stt, assets-stt\sense-voice, assets-stt\vad | Out-Null
          Invoke-WebRequest "$base/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2" -OutFile sv.tar.bz2
          tar -xjf sv.tar.bz2
          Copy-Item 'sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17\model.int8.onnx',
                    'sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17\tokens.txt' assets-stt\sense-voice\
          Invoke-WebRequest "$base/silero_vad.onnx" -OutFile assets-stt\vad\silero_vad.onnx

      - name: Fetch MinGit runtime
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONUTF8: "1" # runner 默认 cp1252，脚本输出中文会炸
        run: python tools/fetch_runtime.py --mirror github

      - name: Assemble package
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "dist\neo"
          if (Test-Path $pkg) { throw "Package directory must be clean: $pkg" }
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\neo.exe $pkg\
          Copy-Item -Recurse crates\neo-wake\assets "$pkg\assets"
          Copy-Item -Recurse assets-stt "$pkg\assets-stt"
          Copy-Item -Recurse runtime "$pkg\runtime"
          Copy-Item README.md, LICENSE $pkg\

      # 只从已授权 VS 的 Redist 目录收集真实导入依赖，不使用 System32 或执行 vc_redist。
      # app-local CRT 安全更新需要随 Neo 重新发布；UCRT/API sets 由 Win10 自带。
      - name: Audit packaged PE imports and collect app-local MSVC CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Licensed Visual Studio C++ tools not found' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin -or -not $crt) { throw 'MSVC dumpbin or licensed x64 CRT redistributables missing; no system DLL fallback' }
          python tools/check_release.py --package dist/neo --dumpbin "$($dumpbin.FullName)" --redist-dir "$($crt.FullName)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged PE / CRT audit failed' }

      - name: Zip portable package
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zip = "dist\neo-${{ steps.ver.outputs.version }}-portable-x64.zip"
          7z a -tzip -mx=5 $zip ".\dist\neo" | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { throw "7z exit $LASTEXITCODE" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Generate installer art
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --quiet pillow
          python tools/make_installer_art.py --out build/installer-art

      - name: Build installer (NSIS)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # runner 镜像自带 NSIS；没有则走 choco 兜底
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) {
            choco install nsis -y --no-progress | Select-Object -Last 1
            $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          # VIProductVersion 要四段纯数字：剥掉预发布后缀再补零
          $v = "${{ steps.ver.outputs.version }}"
          $p = @(($v -replace '-.*$', '').Split('.')) + @('0', '0', '0')
          $vi = ($p[0..2] -join '.') + '.0'
          # 美术缺失宁可失败也不悄悄出个无品牌安装包
          if (-not (Test-Path build\installer-art\neo.ico)) { throw "installer art missing" }
          # makensis 默认把编译工作目录切到脚本所在目录（tools\）：/NOCD 保持
          # 在仓库根，脚本里的相对路径才找得到 dist\ 与 build\；
          # /INPUTCHARSET UTF8：脚本是 UTF-8（中文注释），默认 ACP 会报编码错。
          & $mk /NOCD /INPUTCHARSET UTF8 "/DVERSION=$v" "/DVI_VERSION=$vi" tools\installer.nsi | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "makensis exit $LASTEXITCODE" }

      - name: Generate changelog
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        id: log
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $prev = git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $commits = git log $range --pretty=format:'- %h %s (@%an)' --no-merges
          $notes = @()
          $notes += "## Neo ${{ steps.ver.outputs.version }}"
          $notes += ''
          $notes += '### Commits'
          $notes += ''
          if ($prev) { $notes += "Changes since ``$prev``:" ; $notes += '' }
          $notes += $commits
          $notes += ''
          $notes += '### Artifacts'
          $notes += ''
          $notes += "- ``neo-${{ steps.ver.outputs.version }}-installer-x64.exe`` — 安装包（per-user 免管理员，装到 ``%LOCALAPPDATA%\Programs\Neo``，含卸载与开始菜单/桌面快捷方式）"
          $notes += "- ``neo-${{ steps.ver.outputs.version }}-portable-x64.zip`` — 便携包（解压即用）"
          $notes += ''
          $notes += '两者内容一致：'
          $notes += ''
          $notes += '- ``neo.exe`` - main application'
          $notes += '- ``assets/`` - wake-word models (melspectrogram / embedding / hi_neo + onnxruntime)'
          $notes += '- ``assets-stt/`` - SenseVoice int8 ASR + Silero VAD'
          $notes += '- ``runtime/gitbash/`` - bundled MinGit (bash tool runtime)'
          $notes -join "`n" | Out-File -Encoding utf8 dist\notes.md
          Get-Content dist\notes.md

      - name: Create release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $installer = "dist\neo-${{ steps.ver.outputs.version }}-installer-x64.exe"
          $args = @('release', 'create', $tag, $installer, "${{ steps.zip.outputs.zip }}",
                    '--verify-tag', '--title', "Neo $tag", '--notes-file', 'dist\notes.md')
          if ("${{ steps.ver.outputs.prerelease }}" -eq 'true') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create exit $LASTEXITCODE" }
