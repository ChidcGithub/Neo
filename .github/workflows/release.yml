# main / release/** 推送及面向 main 的 PR 只读检查。
# v* tag / 手动发布才授予 contents: write；两个 caller 互斥，不重复构建。
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 分支检查被新推送取代即可取消；tag 发布永不取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      publish: true
