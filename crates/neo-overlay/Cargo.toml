[package]
name = "neo-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
neo-tools = { workspace = true }
neo-theme = { workspace = true }
# 统一渲染层：卡片 UI 用内嵌的独立 egui 上下文绘制（与主界面 eframe
# 互不干扰）。egui-wgpu 0.36 内部就是 wgpu 30，与本 crate 同源同 device。
egui = "0.36.2"
egui-wgpu = "0.36.2"
wgpu = "30"
pollster = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# 与 wgpu 30 内部的 naga 同主版本：shader 单测的解析方言与运行时一致
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
# 透镜预览图导出（--ignored 手动测试用）
image = { workspace = true }
